site_name: Cardano Node assets for Antithesis
site_url: https://cardano-foundation.github.io/cardano-node-antithesis/
repo_url: https://github.com/cardano-foundation/cardano-node-antithesis

theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - navigation.path

plugins:
  - search
  - asciinema-player

markdown_extensions:
  - callouts
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Images:
      - Provenance: images/provenance.md
  - Components:
      - Tracer: components/tracer.md
      - Tracer-sidecar: components/tracer-sidecar.md
      - Sidecar: components/sidecar.md
      - Configurator: components/configurator.md
      - Config: components/config.md
      - Adversary: components/adversary.md
      - Adversary roadmap: components/adversary-roadmap.md
      - Asteria Game: components/asteria-player.md
      - Tx-generator: components/tx-generator.md
  - Testnets:
      - testnets/index.md
      - Cardano Node Releases: testnets/cardano-node-releases.md
  - Daily candidates:
      - Cardano Node HEAD candidate: daily-cardano-node-head.md
      - Daily Amaru: daily-amaru.md
  - Multi-run overview: overview.md
  - Triage: triage.md
  - Querying logs: query-logs.md
  - Contributing: contributing.md
