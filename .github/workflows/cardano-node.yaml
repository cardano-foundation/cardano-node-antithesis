name: "Antithesis on cardano-node testnet"
env:
  # workflow_dispatch passes `inputs.test`; cron has no inputs so
  # falls through to the default. Without the `inputs.test` lookup
  # here, every manual dispatch silently ran against
  # cardano_node_master regardless of the -f test=... flag.
  TESTNET: ${{ inputs.test || 'cardano_node_master' }}
  REGISTRY: ghcr.io/cardano-foundation/cardano-node-antithesis
  EMAILS: 'antithesis@cardanofoundation.org'
  DURATION: ${{ inputs.duration || 3 }}
on:
  # can be dispatched manually
  workflow_dispatch:
     inputs:
       test:
        description: 'Test configuration to run (a directory in testnets)'
        required: true
        default: cardano_node_master
        type: string
       duration:
        description: 'Test duration (in hours)'
        required: false
        default: 3
        type: number
       no-faults:
        description: 'Run the test without injecting faults'
        required: false
        default: false
        type: boolean
  schedule:
    # run every 6 hours
    - cron:  '5 1,7,13,19 * * *'

jobs:
  run-cardano-node:
    runs-on: ubuntu-latest
    env:
      MOOG_GITHUB_PAT: ${{ secrets.MOOG_GITHUB_PAT }}
      MOOG_WALLET_FILE: wallet.json
      MOOG_MPFS_HOST: ${{ vars.MOOG_MPFS_HOST }}
      MOOG_TOKEN_ID: ${{ vars.MOOG_TOKEN_ID }}
      MOOG_PLATFORM: github
      MOOG_REQUESTER: cfhal

    timeout-minutes: 600

    # required permissions to be able to push to registry, plus
    # issues:write so a failed scheduled run can open/append an alert, and
    # contents:write so the daily HEAD testnet can create its one-shot
    # submission-lock tag in this repository.
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
      issues: write


    steps:
    - name: 🚧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 📥 Checkout repository
      uses: actions/checkout@v6

    - name: 🔑 Login Docker Registry
      uses: docker/login-action@v3
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install moog
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # Pinned moog release. The production MPFS/agent/oracle stack runs the
        # v0.5.x line, so the requester CLI must match it. Do NOT track the
        # "latest" release: moog v2.0.0 (the moog-v2 MPFS cutover, 2026-06-13)
        # is incompatible with the deployed v0.5.x MPFS — its `facts test-runs`
        # returns an error envelope instead of the array this workflow's jq
        # expects, which silently broke every scheduled launch. Bump this tag
        # only once the whole stack migrates to v2.
        # The portable Linux requester binary is the statically-linked musl
        # tarball (the old `*-linux64.tar.gz` asset was dropped at the 0.5.x
        # packaging change).
        TAG=v0.5.1.5
        echo "moog release: $TAG"
        gh release download "$TAG" -R cardano-foundation/moog \
          -p 'moog-*-x86_64-linux-musl.tar.gz' --clobber
        TARBALL=$(ls moog-*-x86_64-linux-musl.tar.gz | grep -vE 'moog-(agent|oracle)-' | head -1)
        echo "using $TARBALL"
        tar xzf "$TARBALL"
        sudo install -m 0755 moog /usr/local/bin/moog
        moog --version

    - name: Configure moog wallet
      env:
        MOOG_REQUESTER_WALLET: ${{ secrets.MOOG_REQUESTER_WALLET }}
      run: printf '%s' "$MOOG_REQUESTER_WALLET" | base64 --decode > "$MOOG_WALLET_FILE"

    - name: Submit test
      id: request
      env:
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        # One real attempt per UTC day for the HEAD testnet, from these
        # guards: the daily controller's day claim (one dispatch per day),
        # this step's run-attempt guard, the atomic submission-lock ref
        # created below (the exclusion: a create-once tag per consumer
        # commit), and the read-only MOOG census refusal (an extra belt).
        if [ "$TESTNET" = "cardano_node_head" ] && [ "$RUN_ATTEMPT" != "1" ]; then
          printf 'daily-head-rerun-refused: testnet=%s attempt=%s\n' "$TESTNET" "$RUN_ATTEMPT" >&2
          exit 1
        fi
        COMMIT="${{ github.sha }}"
        TESTNET_DIR="testnets/$TESTNET"
        lock_ref="refs/tags/daily-cardano-node-head-submitted/$COMMIT"
        if [ "$TESTNET" = "cardano_node_head" ]; then
          # The submission lock is the exclusion: a create-once tag at the
          # consumer commit. An existing lock, a push the remote refuses,
          # or a push that turns out not to have created the ref (git
          # reports an identical existing tag as up-to-date, exit 0) all
          # stop before any MOOG request is constructed.
          if git ls-remote origin "$lock_ref" | grep -q .; then
            printf 'daily-head-already-submitted: lock exists at %s\n' "$COMMIT" >&2
            exit 1
          fi
          lock_output=''
          if ! lock_output=$(git push --porcelain origin "$COMMIT:$lock_ref" 2>&1); then
            printf 'daily-head-lock-unpushable: testnet=%s\n' "$TESTNET" >&2
            exit 1
          fi
          if ! printf '%s\n' "$lock_output" | grep -Eq "^\*[[:space:]][^[:space:]]+:$lock_ref"; then
            printf 'daily-head-already-submitted: %s was not created by this run\n' "$lock_ref" >&2
            exit 1
          fi
        fi
        census=''
        if ! census=$(moog facts test-runs --whose "$MOOG_REQUESTER"); then
          if [ "$TESTNET" = "cardano_node_head" ]; then
            printf 'daily-head-census-unreadable: testnet=%s\n' "$TESTNET" >&2
          else
            printf 'moog census unreadable\n' >&2
          fi
          exit 1
        fi
        existing=$(printf '%s' "$census" | jq \
          --arg commit "$COMMIT" \
          --arg directory "$TESTNET_DIR" \
          --arg platform "$MOOG_PLATFORM" \
          --arg repository "$GITHUB_REPOSITORY" \
          --arg requester "$MOOG_REQUESTER" \
          'map(select(
            .key.type == "test-run"
            and .key.commitId == $commit
            and .key.directory == $directory
            and .key.platform == $platform
            and ((.key.repository.organization + "/" + .key.repository.repo) == $repository)
            and .key.requester == $requester
          )) | length')
        if [ "$TESTNET" = "cardano_node_head" ] && [ "$existing" != "0" ]; then
          printf 'daily-head-already-submitted: testnet=%s existing=%s\n' "$TESTNET" "$existing" >&2
          exit 1
        fi
        TRY=$((existing + 1)) # start with try=1
        echo "TRY=$TRY for $TESTNET_DIR"
        if [ "${{ inputs.no-faults }}" = "true" ]; then
          render_args=(--no-faults)
        else
          render_args=()
        fi
        RESULT=$(moog requester create-test -d "$TESTNET_DIR" \
          -c "$COMMIT" \
          -r "$GITHUB_REPOSITORY" \
          --try "$TRY" \
          -t "$DURATION" \
          "${render_args[@]}")
        echo "$RESULT"

        # Passing -e and -r in separate jq calls ensures we both unwrap
        # the string quotes and fail if the json isn't as expected.
        ID=$(echo "$RESULT" | jq -e .value.testRunId | jq -r .)
        TXID=$(echo "$RESULT" | jq -e .txHash | jq -r .)
        echo "id=$ID" >> "$GITHUB_OUTPUT"
        echo "txHash=$TXID" >> "$GITHUB_OUTPUT"

    - name: Wait for results
      run: timeout $(((DURATION + 1) * 3600)) ./scripts/wait-for-test.sh "${{ steps.request.outputs.id }}"

    # The daily controller (daily-cardano-node-head.yaml) correlates its
    # terminal receipt with this run's MOOG test identity through this
    # artifact. Always reached, so a failed wait still exposes the phase the
    # test actually reached.
    - name: Expose MOOG correlation
      if: ${{ always() }}
      env:
        TEST_RUN_ID: ${{ steps.request.outputs.id }}
      run: |
        set -euo pipefail
        correlation="$RUNNER_TEMP/moog-correlation"
        if [ -n "$TEST_RUN_ID" ]; then
          RESULT=$(moog facts test-runs --test-run-id "$TEST_RUN_ID")
          printf 'test_run_id=%s\n' "$TEST_RUN_ID" >"$correlation"
          printf 'phase=%s\n' "$(printf '%s' "$RESULT" | jq -r '.[0].value.phase // "unknown"')" >>"$correlation"
          printf 'outcome=%s\n' "$(printf '%s' "$RESULT" | jq -r '.[0].value.outcome // "-"')" >>"$correlation"
          printf 'report_url=%s\n' "$(printf '%s' "$RESULT" | jq -r '.[0].value.url // "-"')" >>"$correlation"
        else
          {
            printf 'test_run_id=-\n'
            printf 'phase=never-submitted\n'
            printf 'outcome=-\n'
            printf 'report_url=-\n'
          } >"$correlation"
        fi
        cat "$correlation"

    - name: Upload MOOG correlation
      if: ${{ always() }}
      uses: actions/upload-artifact@v6
      with:
        name: moog-correlation
        path: ${{ runner.temp }}/moog-correlation
        if-no-files-found: error

    # A scheduled run can fail silently for days (e.g. an upstream release
    # renames an asset). On a scheduled failure, open — or append to — a
    # single tracking issue so the breakage is visible.
    - name: Alert on scheduled failure
      if: ${{ failure() && github.event_name == 'schedule' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        TITLE="Nightly Antithesis run is failing"
        URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open \
          --search "$TITLE in:title" --json number --jq '.[0].number // empty')
        if [ -n "$NUM" ]; then
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" -b "Still failing: $URL"
        else
          gh issue create -R "$GITHUB_REPOSITORY" -t "$TITLE" \
            -b "The scheduled \`cardano-node.yaml\` workflow failed. Latest run: $URL"
        fi
