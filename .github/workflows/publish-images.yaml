name: "Build and push component images for cardano-node testnet"
env:
  REGISTRY: ghcr.io/cardano-foundation/cardano-node-antithesis
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asteria-dev-shell:
    name: Asteria development shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build through the component's development shell
        working-directory: components/asteria-game
        run: >-
          nix develop --quiet .#ci -c bash -c
          'cabal update && cabal build all -O0'

  check-image-provenance:
    name: Check image provenance (daemon-free)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref_name || '' }}
      - uses: paolino/dev-assets/setup-nix@v0.0.1
        with:
          cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run provenance proof
        run: nix develop --quiet -c just check-image-provenance

  publish-images:
    needs: check-image-provenance
    runs-on: ubuntu-24.04

    # required permissions to be able to push to registry
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
    - name: 🚧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 📥 Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.ref_name || '' }}
    - name: Check Amaru producer image contract
      run: scripts/check-amaru-producer-image-refs.sh
    - uses: paolino/dev-assets/setup-nix@v0.0.1
      with:
        cachix-auth-token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
    - name: 🔑 Login Docker Registry
      uses: docker/login-action@v3
      with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    - name: Collect images to publish
      id: images
      run: |
        scripts/push-images.sh

  smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    needs: publish-images
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref_name || '' }}
      - name: Run smoke test
        run: ./scripts/smoke-test.sh cardano-node-releases 600
      - name: Run smoke test (cardano_amaru)
        env:
          AMARU_BOOTSTRAP_SMOKE_TIMEOUT: "900"
        run: ./scripts/smoke-test.sh cardano_amaru 700
